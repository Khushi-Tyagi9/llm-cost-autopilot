# Maps classifier tier predictions to actual model configs.
# Edit this file to change routing behavior without touching code.

routing:
  1:
    model: groq_cheap
    description: "Simple tasks - extraction, reformatting, basic Q&A"
  2:
    model: groq_cheap
    description: "Moderate tasks - summarization, classification, structured analysis"
  3:
    model: groq_premium
    description: "Complex tasks - multi-step reasoning, creative generation, nuanced judgment"

verification:
  sample_rate: 0.15
  divergence_threshold:
    1: 0.20   # factual/extraction - low tolerance, answers should closely match
    2: 0.40   # moderate/summarization - some wording variation expected
    3: 0.65   # creative/complex - high tolerance, divergent phrasing is normal

models:
  groq_cheap:
    provider: groq
    model_id: llama-3.1-8b-instant
    cost_per_input_token: 0.00000005
    cost_per_output_token: 0.00000008
    quality_tier: 1
  groq_premium:
    provider: groq
    model_id: llama-3.3-70b-versatile
    cost_per_input_token: 0.00000059
    cost_per_output_token: 0.00000079
    quality_tier: 3